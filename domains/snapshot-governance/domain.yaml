name: snapshot-governance
version: 0.1.0
evidence_class: chain-state
display: "Snapshot proposal outcomes"
description: "Verifies governance work against Snapshot: proposal resolves, author binds, and declared outcome params (state, quorum, winning choice, space) hold — a deterministic public-state read."
