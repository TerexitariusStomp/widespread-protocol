display: "TEE-attested inference/work receipts"
description: "Verifies a NEAR AI Cloud (provider_tee) signed completion: fetches the provider's signature record for the chat id and binds model + nonce + request hash to the market params. Honest limit: attestation proves WHICH model ran the exact bytes — not that the answer was right."
